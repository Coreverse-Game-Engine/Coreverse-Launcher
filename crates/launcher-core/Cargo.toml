[package]
name = "launcher-core"
description = "Tauri-independent core logic of Coreverse Launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1.1.11"
futures-util = "0.3.34"
hex = "0.4.3"
qbsdiff = { version = "1.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
semver = "1.0.28"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

# The OS credential store holds the refresh token. Linux needs a Secret Service provider
# (GNOME Keyring, KWallet, ...) and the libdbus development files at build time.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2.0", features = ["dbus-secret-service-keyring-store"] }

[lints]
workspace = true
