[package]
name = "launcher-core"
description = "Tauri-independent core logic of Coreverse Launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tar = "0.4"
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1", features = ["fs", "io-util", "rt", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

# The OS credential store holds the refresh token. Linux needs a Secret Service provider
# (GNOME Keyring, KWallet, ...) and the libdbus development files at build time.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2.0", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2.0", features = ["dbus-secret-service-keyring-store"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
