name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    CARGO_TERM_COLOR: always
    # `@Coreverse-Game-Engine/db-client` lives in GitHub Packages. The workflow token can read it
    # once the package grants this repository access (package settings -> "Manage Actions
    # access"). A repository secret named GH_PACKAGES_TOKEN (a token with `read:packages`) takes
    # precedence, which also works while that access is not set up.
    PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
    release-tooling:
        name: Release tooling (scripts, shell)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  # Without this v5 turns caching on by itself (packageManager is set) and needs pnpm already.
                  package-manager-cache: false

            - run: node scripts/release/check-version.mjs
            - run: node --test "scripts/**/*.test.mjs"
            - name: Lint the shell scripts
              run: shellcheck -s bash scripts/package/*.sh && shellcheck -s sh scripts/install/install.sh

    frontend:
        name: Frontend (format, lint, types, tests, build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  # Without this v5 turns caching on by itself (packageManager is set) and needs pnpm already.
                  package-manager-cache: false

            # pnpm comes from the `packageManager` field of package.json.
            - run: corepack enable

            - name: Authenticate to GitHub Packages
              run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}" >> ~/.npmrc

            - name: Check access to the db-client package
              continue-on-error: true
              run: |
                  for name in '@Coreverse-Game-Engine%2Fdb-client' '@coreverse-game-engine%2Fdb-client'; do
                      code=$(curl -s -o /dev/null -w '%{http_code}' \
                          -H "Authorization: Bearer ${PACKAGES_TOKEN}" \
                          "https://npm.pkg.github.com/${name}")
                      echo "https://npm.pkg.github.com/${name} -> HTTP ${code}"
                  done

            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check
            - run: pnpm run lint
            - run: pnpm run typecheck
            - run: pnpm run typecheck:compat
            - run: pnpm run test
            - run: pnpm run build

    rust:
        name: Rust (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: Linux x64, os: ubuntu-24.04 }
                    - { name: Windows x64, os: windows-latest }
                    - { name: macOS arm64, os: macos-latest }
                    - { name: macOS x64, os: macos-15-intel }
        steps:
            - uses: actions/checkout@v5

            - name: Install Linux system packages
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
                      libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
                      libdbus-1-dev pkg-config

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2

            # Tauri embeds `frontendDist` at compile time; the Rust checks do not need the real UI.
            - name: Create a placeholder frontend build
              shell: bash
              run: |
                  mkdir -p dist
                  echo '<!doctype html><title>placeholder</title>' > dist/index.html

            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo test --workspace

    linux-distros:
        name: Linux (${{ matrix.name }})
        runs-on: ubuntu-latest
        container:
            image: ${{ matrix.image }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Debian
                      image: debian:stable
                      install: >-
                          apt-get update && apt-get install -y git ca-certificates curl wget file
                          build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
                          libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
                    - name: Fedora
                      image: fedora:latest
                      install: >-
                          dnf install -y git curl wget file gcc gcc-c++ make pkgconf-pkg-config
                          webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel
                          librsvg2-devel libxdo-devel dbus-devel
                    - name: Arch
                      image: archlinux:latest
                      install: >-
                          pacman -Syu --noconfirm --needed git curl wget file base-devel pkgconf
                          webkit2gtk-4.1 openssl libappindicator-gtk3 librsvg xdotool dbus
                    - name: openSUSE
                      image: opensuse/tumbleweed:latest
                        # Capabilities instead of package names: Tumbleweed renames the WebKitGTK
                        # development packages from time to time, the pkg-config names stay.
                      install: >-
                          zypper --non-interactive install bash git curl wget file tar gzip gcc gcc-c++
                          make pkgconf-pkg-config "pkgconfig(webkit2gtk-4.1)" "pkgconfig(gtk+-3.0)"
                          "pkgconfig(libsoup-3.0)" "pkgconfig(librsvg-2.0)" "pkgconfig(openssl)"
                          "pkgconfig(dbus-1)"
        steps:
            - name: Install system packages
              run: ${{ matrix.install }}

            - uses: actions/checkout@v5

            # Not `dtolnay/rust-toolchain`: that action needs `bash`, which minimal images lack.
            # Do not extend PATH through $GITHUB_PATH here: when an image sets no PATH of its own
            # (openSUSE Tumbleweed), the runner then replaces the whole PATH with just the added
            # folder and even `sh` can no longer be found. Symlinks into /usr/local/bin avoid that.
            - name: Install Rust
              run: |
                  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
                  for tool in cargo rustc rustup; do
                      ln -sf "$HOME/.cargo/bin/$tool" "/usr/local/bin/$tool"
                  done
                  cargo --version

            - name: Create a placeholder frontend build
              run: |
                  mkdir -p dist
                  echo '<!doctype html><title>placeholder</title>' > dist/index.html

            - run: cargo test --workspace
