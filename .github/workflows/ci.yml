name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    CARGO_TERM_COLOR: always
    # `@Coreverse-Game-Engine/db-client` lives in GitHub Packages of the same organization, so the
    # workflow's own token can read it (this needs `packages: read` above and, in the package's
    # settings, access for this repository).
    PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
    frontend:
        name: Frontend (format, lint, types, tests, build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: pnpm

            - name: Authenticate to GitHub Packages
              run: echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}" >> ~/.npmrc

            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check
            - run: pnpm run lint
            - run: pnpm run typecheck
            - run: pnpm run typecheck:compat
            - run: pnpm run test
            - run: pnpm run build

    rust:
        name: Rust (${{ matrix.name }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { name: Linux x64, os: ubuntu-24.04 }
                    - { name: Windows x64, os: windows-latest }
                    - { name: macOS arm64, os: macos-latest }
                    - { name: macOS x64, os: macos-15-intel }
        steps:
            - uses: actions/checkout@v5

            - name: Install Linux system packages
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
                      libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
                      libdbus-1-dev pkg-config

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2

            # Tauri embeds `frontendDist` at compile time; the Rust checks do not need the real UI.
            - name: Create a placeholder frontend build
              shell: bash
              run: |
                  mkdir -p dist
                  echo '<!doctype html><title>placeholder</title>' > dist/index.html

            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo test --workspace

    linux-distros:
        name: Linux (${{ matrix.name }})
        runs-on: ubuntu-latest
        container:
            image: ${{ matrix.image }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Debian
                      image: debian:stable
                      install: >-
                          apt-get update && apt-get install -y git ca-certificates curl wget file
                          build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
                          libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
                    - name: Fedora
                      image: fedora:latest
                      install: >-
                          dnf install -y git curl wget file gcc gcc-c++ make pkgconf-pkg-config
                          webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel
                          librsvg2-devel libxdo-devel dbus-devel
                    - name: Arch
                      image: archlinux:latest
                      install: >-
                          pacman -Syu --noconfirm --needed git curl wget file base-devel pkgconf
                          webkit2gtk-4.1 openssl libappindicator-gtk3 librsvg xdotool dbus
                    - name: openSUSE
                      image: opensuse/tumbleweed:latest
                        # Capabilities instead of package names: Tumbleweed renames the WebKitGTK
                        # development packages from time to time, the pkg-config names stay.
                      install: >-
                          zypper --non-interactive install bash git curl wget file tar gzip gcc gcc-c++
                          make pkgconf-pkg-config "pkgconfig(webkit2gtk-4.1)" "pkgconfig(gtk+-3.0)"
                          "pkgconfig(libsoup-3.0)" "pkgconfig(librsvg-2.0)" "pkgconfig(openssl)"
                          "pkgconfig(dbus-1)"
        steps:
            - name: Install system packages
              run: ${{ matrix.install }}

            - uses: actions/checkout@v5

            - uses: dtolnay/rust-toolchain@stable

            - name: Create a placeholder frontend build
              run: |
                  mkdir -p dist
                  echo '<!doctype html><title>placeholder</title>' > dist/index.html

            - run: cargo test --workspace
