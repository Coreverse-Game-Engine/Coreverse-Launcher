version: 2

registries:
    github-packages:
        type: npm-registry
        url: https://npm.pkg.github.com
        token: ${{ secrets.GH_PACKAGES_TOKEN }}

updates:
    - package-ecosystem: npm
      directory: /
      registries:
          - github-packages
      schedule:
          interval: weekly
      groups:
          minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      groups:
          minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
